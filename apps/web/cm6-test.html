<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>CM6 npm 替换 + CM5 Trap 测试</title>
<link rel="stylesheet" href="/vendor/app.scoped.css">
<style>
  :root {
    --font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-monospace: "SFMono-Regular", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #toolbar {
    padding: 8px 16px;
    border-bottom: 1px solid var(--background-modifier-border, #454545);
    font-size: 13px;
    background: var(--background-secondary, #1e1e1e);
    color: var(--text-muted, #999);
  }
  #log {
    padding: 8px 16px;
    font-size: 12px;
    font-family: monospace;
    background: #1a1a1a;
    color: #4caf50;
    max-height: 200px;
    overflow-y: auto;
    border-bottom: 1px solid #333;
  }
  #log .error { color: #f44336; }
  #log .warn { color: #ff9800; }
  .view-content {
    flex: 1;
    overflow: hidden;
    display: flex;
  }
  .view-content > .markdown-source-view {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body class="theme-dark">
<div id="toolbar">CM6 npm 替换 + CM5 Trap — 加载中...</div>
<div id="log"></div>
<div class="view-content">
  <div id="editor" class="markdown-source-view mod-cm6 is-live-preview is-readable-line-width"></div>
</div>

<script type="module">
import { initCm6Runtime } from './src/cm6-runtime.ts';
import { createCM5Trap } from './src/cm5-trap.ts';

const logEl = document.getElementById('log');
const cm5Calls: string[] = [];

function log(msg, cls = '') {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = new Date().toISOString().slice(11, 23) + ' ' + msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

// ── 1. 设置 CM5 trap（在 vendor 加载前） ──
window.CodeMirror = createCM5Trap({
  onLog(msg, stack) {
    cm5Calls.push(msg);
    log(msg, 'warn');
  },
  strict: false, // 非严格模式：记录但不阻断
});

// ── 2. 加载 CM6 npm 运行时 ──
await initCm6Runtime({
  onLog(msg, level) {
    log(msg, level === 'error' ? 'error' : '');
  },
});

// ── 3. 加载 vendor 依赖 ──
{
  const scripts = ['/vendor/lib/i18next.min.js', '/vendor/enhance.js', '/vendor/mock.js'];
  for (const src of scripts) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => { log(`  ${src.split('/').pop()} loaded`); resolve(undefined); };
      s.onerror = () => reject(new Error(src));
      document.head.appendChild(s);
    });
  }
}

// ── 4. 加载 externalized vendor ──
log('加载 externalized vendor (npm CM6)...');
await new Promise((resolve, reject) => {
  const s = document.createElement('script');
  s.src = '/vendor/obsidian-app.cm6-external.js';
  s.onload = () => { log('vendor 加载完成'); resolve(undefined); };
  s.onerror = () => reject(new Error('vendor load failed'));
  document.head.appendChild(s);
});

// ── 5. 检查产物 ──
const checks = ['__cm6', '__kH', '__language', '__stateFields', '__closeBrackets', '__compartments'];
for (const key of checks) {
  const v = (window as any)[key];
  if (v !== undefined) {
    const info = typeof v === 'object' ? Object.keys(v).join(', ') : typeof v;
    log(`  window.${key}: ${info}`);
  } else {
    log(`  window.${key}: UNDEFINED`, 'error');
  }
}

// ── 6. CM5 调用统计 ──
if (cm5Calls.length > 0) {
  log(`CM5 被访问 ${cm5Calls.length} 次（详见控制台）`, 'warn');
} else {
  log('CM5 未被访问 ✓');
}

document.getElementById('toolbar').textContent = 'CM6 npm 替换 + CM5 Trap — 就绪';
log('初始化完成！');

// ── 7. 尝试创建编辑器 ──
try {
  const { createEditor } = await import('@xlxz/markdown-editor');
  const container = document.getElementById('editor');
  const instance = createEditor(container, {
    doc: '# Hello\n\nnpm CM6 powered editor.\n\n- item 1\n- item 2',
    filePath: 'test.md',
    theme: 'dark',
  });
  (window as any).__editorView = instance.view;
  instance.focus();
  log('编辑器创建成功 ✓');
} catch (e) {
  log('编辑器创建失败: ' + (e as Error).message, 'error');
}
</script>
</body>
</html>
