<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>xlxz-markdown-editor — Standalone Demo</title>
<link rel="stylesheet" href="/vendor/app.scoped.css">
<style>
  :root {
    --font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-monospace: "SFMono-Regular", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #toolbar {
    padding: 8px 16px;
    border-bottom: 1px solid var(--background-modifier-border, #454545);
    font-size: 13px;
    background: var(--background-secondary, #1e1e1e);
    color: var(--text-muted, #999);
  }
  .view-content {
    flex: 1;
    overflow: hidden;
    display: flex;
  }
  .view-content > .markdown-source-view {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body class="theme-dark">
<div id="toolbar">xlxz-markdown-editor — Standalone</div>
<div class="view-content">
  <div id="editor" class="markdown-source-view mod-cm6 is-live-preview is-readable-line-width"></div>
</div>

<!-- Vendor 运行时（顺序重要） -->
<script src="/vendor/lib/i18next.min.js"></script>
<script src="/vendor/lib/codemirror.js"></script>
<script src="/vendor/lib/meta.min.js"></script>
<script src="/vendor/lib/modes.min.js"></script>
<script src="/vendor/lib/markdown.js"></script>
<script src="/vendor/lib/turndown.js"></script>
<script src="/vendor/enhance.js"></script>
<script src="/vendor/mock.js"></script>
<script src="/vendor/obsidian-app.patched.js"></script>

<script type="module">
  import { createEditor } from '/@fs/E:/_Project/@xlxz/markdown-editor/packages/core/dist/index.js';

  function waitForRuntime(attempt = 0) {
    if (window.__cm6) {
      initEditor();
      return;
    }
    if (attempt < 50) {
      setTimeout(() => waitForRuntime(attempt + 1), 100);
    } else {
      document.getElementById('toolbar').textContent = 'Error: Obsidian runtime failed to load';
    }
  }

  function initEditor() {
    const editor = createEditor(document.getElementById('editor'), {
      doc: '# Hello World\n\nStart writing **Markdown** here.\n\n- item 1\n- item 2\n\n```js\nconsole.log("hello");\n```',
      filePath: 'demo.md',
      theme: 'dark',
      onChange(doc) {
        document.getElementById('toolbar').textContent =
          'xlxz-markdown-editor — ' + doc.length + ' chars';
      },
      onSave(doc) {
        console.log('Save:', doc.length, 'chars');
      },
    });

    editor.focus();
  }

  waitForRuntime();
</script>
</body>
</html>
